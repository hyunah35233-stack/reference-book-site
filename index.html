<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Card Catalog</title>
  <link rel="stylesheet" href="cabinet.css" />
</head>
<body>
  <div class="room">
    <div class="stage" id="stage">
      <div class="cabinet" id="cabinet">
        <div class="cabinet-top"></div>
        <div class="drawers" id="drawers"></div>
        <div class="cabinet-base"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-backdrop" data-close></div>
    <div class="tray" role="dialog" aria-modal="true" aria-labelledby="trayLabel">
      <div class="tray-head">
        <span class="tray-label" id="trayLabel"></span>
        <button class="tray-close" id="trayClose" type="button" data-close>Close</button>
      </div>
      <div class="tray-cards" id="trayCards"></div>
    </div>
  </div>

  <script src="drawers.js"></script>
  <script src="cards.js"></script>
  <script src="cabinet.js"></script>
</body>
</html>
