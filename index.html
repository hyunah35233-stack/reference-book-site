<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Reference Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="cabinet.css?v=44" />
</head>
<body>
  <nav class="langswitch" id="langswitch" aria-label="Language"></nav>

  <div class="room" id="room">
    <div class="stage" id="stage">
      <svg class="cabinet-frame" id="cabinetFrame" viewBox="0 0 1001 635" aria-hidden="true"></svg>
      <div class="drawers" id="drawers"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-backdrop" data-close></div>
    <div class="tray" role="dialog" aria-modal="true" aria-labelledby="trayLabel">
      <svg class="tray-ink" id="trayInk" aria-hidden="true"></svg>
      <div class="tray-head">
        <span class="tray-label" id="trayLabel"></span>
        <button class="tray-close" id="trayClose" type="button" data-close></button>
      </div>
      <div class="tray-cards" id="trayCards"></div>
    </div>
  </div>

  <main class="notepage" id="notepage" hidden></main>

  <noscript><p style="padding:20px;font-family:sans-serif">This catalog needs JavaScript. The plain list is at <a href="list.html">list.html</a>.</p></noscript>

  <script src="vendor/rough.js"></script>
  <script src="drawers.js?v=44"></script>
  <script src="i18n.js?v=44"></script>
  <script src="cabinet.js?v=44"></script>
</body>
</html>
